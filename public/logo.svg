<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#0a0d12" stroke="#4da3ff" stroke-width="2"/>
  
  <!-- Inner glow ring -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#glow)" stroke-width="1.5" opacity="0.6"/>
  
  <!-- JT Monogram -->
  <g transform="translate(60, 60)">
    <!-- J -->
    <path d="M-24 18 Q-24 24 -18 24 L-18 6 Q-18 0 -12 0 L12 0 Q18 0 18 6 L18 -18" 
          stroke="#4da3ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- T -->
    <path d="M-12 -24 L12 -24 M0 -24 L0 18" 
          stroke="#4da3ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Dot accent -->
    <circle cx="18" cy="-24" r="3" fill="#7ee787"/>
  </g>
  
  <!-- Outer orbit ring -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="#4da3ff" stroke-width="1" stroke-dasharray="8 12" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="20s" repeatCount="indefinite"/>
  </circle>
  
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4da3ff" stop-opacity="0"/>
      <stop offset="70%" stop-color="#4da3ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7ee787" stop-opacity="0.5"/>
    </radialGradient>
  </defs>
</svg>